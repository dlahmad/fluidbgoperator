apiVersion: v1
kind: Namespace
metadata:
  name: fluidbg-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: fluidbg-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.14.1-alpine
          args: ["-js", "-m", "8222"]
          ports:
            - containerPort: 4222
            - containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 2
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: fluidbg-demo
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-flow-nats-sink
  namespace: fluidbg-demo
  labels:
    app.kubernetes.io/part-of: order-flow-nats-demo
    app.kubernetes.io/component: downstream-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-flow-nats-sink
  template:
    metadata:
      labels:
        app: order-flow-nats-sink
        app.kubernetes.io/part-of: order-flow-nats-demo
        app.kubernetes.io/component: downstream-sink
    spec:
      containers:
        - name: sink
          image: fluidbg/fluidbg-example-sink:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: TRANSPORT
              value: nats
            - name: NATS_URL
              value: nats://nats.fluidbg-demo:4222
            - name: INPUT_SUBJECT
              value: results-nats
            - name: NATS_QUEUE_GROUP
              value: order-flow-nats-sink
---
apiVersion: v1
kind: Service
metadata:
  name: order-flow-nats-sink
  namespace: fluidbg-demo
spec:
  selector:
    app: order-flow-nats-sink
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-flow-nats-producer
  namespace: fluidbg-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-flow-nats-producer
  template:
    metadata:
      labels:
        app: order-flow-nats-producer
    spec:
      containers:
        - name: producer
          image: fluidbg/fluidbg-example-producer:dev
          imagePullPolicy: Never
          env:
            - name: TRANSPORT
              value: nats
            - name: NATS_URL
              value: nats://nats.fluidbg-demo:4222
            - name: OUTPUT_SUBJECT
              value: orders-nats
            - name: INTERVAL_SECONDS
              value: "2"
---
apiVersion: fluidbg.io/v1alpha1
kind: BlueGreenDeployment
metadata:
  name: order-flow-nats
  namespace: fluidbg-demo
spec:
  selector:
    matchLabels:
      fluidbg.io/name: order-flow-nats
  deployment:
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: order-flow-nats
      template:
        metadata:
          labels:
            app: order-flow-nats
            fluidbg.io/name: order-flow-nats
        spec:
          terminationGracePeriodSeconds: 1
          containers:
            - name: app
              image: fluidbg/fluidbg-example-order-app:dev
              imagePullPolicy: Never
              env:
                - name: TRANSPORT
                  value: nats
                - name: NATS_URL
                  value: nats://nats.fluidbg-demo:4222
                - name: INPUT_SUBJECT
                  value: orders-nats
                - name: OUTPUT_SUBJECT
                  value: results-nats
                - name: NATS_QUEUE_GROUP
                  value: order-flow-nats
                - name: OUTPUT_PREFIX
                  value: v1
  inceptionPoints: []
  promotion:
    data:
      minTestCases: 1
      successRate: 1.0
      timeoutSeconds: 120
    strategy:
      type: hard-switch
