apiVersion: fluidbg.io/v1alpha1
kind: BlueGreenDeployment
metadata:
  name: order-flow-nats
  namespace: fluidbg-demo
spec:
  selector:
    matchLabels:
      fluidbg.io/name: order-flow-nats
  deployment:
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: order-flow-nats
      template:
        metadata:
          labels:
            app: order-flow-nats
            fluidbg.io/name: order-flow-nats
        spec:
          terminationGracePeriodSeconds: 1
          containers:
            - name: app
              image: fluidbg/fluidbg-example-order-app:dev
              imagePullPolicy: Never
              env:
                - name: TRANSPORT
                  value: nats
                - name: NATS_URL
                  value: nats://nats.fluidbg-demo:4222
                - name: INPUT_SUBJECT
                  value: orders-nats
                - name: OUTPUT_SUBJECT
                  value: results-nats
                - name: NATS_QUEUE_GROUP
                  value: order-flow-nats
                - name: OUTPUT_PREFIX
                  value: v2
                - name: HTTP_UPSTREAM
                  value: http://unused-before-plugin-prepare
  inceptionPoints:
    - name: incoming-nats-orders
      pluginRef:
        name: nats
      roles:
        - splitter
        - observer
      drain:
        maxWaitSeconds: 20
      config:
        splitter:
          inputSubject: orders-nats
          queueGroup: order-flow-nats
          greenInputSubjectEnvVar: INPUT_SUBJECT
          blueInputSubjectEnvVar: INPUT_SUBJECT
          greenQueueGroupEnvVar: NATS_QUEUE_GROUP
          blueQueueGroupEnvVar: NATS_QUEUE_GROUP
          greenQueueGroup: order-flow-nats-green
          blueQueueGroup: order-flow-nats-blue
          temporarySubjectIdentifier: incoming-nats-orders
        observer:
          testId:
            field: nats.body
            jsonPath: $.orderId
          match:
            - field: nats.body
              jsonPath: $.type
              matches: ^demo-order$
          notifyPath: /observe/{testId}/incoming-nats-orders
    - name: audit-http
      pluginRef:
        name: http
      roles:
        - observer
      drain:
        maxWaitSeconds: 20
      config:
        port: 9090
        realEndpoint: http://order-flow-nats-sink.fluidbg-demo:8080
        envVarName: HTTP_UPSTREAM
        testId:
          field: http.body
          jsonPath: $.orderId
        filters:
          - match:
              - field: http.path
                equals: /audit
              - field: http.body
                jsonPath: $.type
                matches: ^demo-order$
            notifyPath: /observe/{testId}/audit-http
            payload: request
    - name: outgoing-nats-results
      pluginRef:
        name: nats
      roles:
        - combiner
      drain:
        maxWaitSeconds: 20
      config:
        combiner:
          outputSubject: results-nats
          greenOutputSubjectEnvVar: OUTPUT_SUBJECT
          blueOutputSubjectEnvVar: OUTPUT_SUBJECT
          temporarySubjectIdentifier: outgoing-nats-results
  test:
    name: verifier
    deployment:
      replicas: 1
      selector:
        matchLabels:
          app: order-flow-nats-verifier
      template:
        metadata:
          labels:
            app: order-flow-nats-verifier
        spec:
          terminationGracePeriodSeconds: 1
          containers:
            - name: verifier
              image: fluidbg/fluidbg-example-verifier:dev
              imagePullPolicy: Never
              ports:
                - containerPort: 8080
              readinessProbe:
                httpGet:
                  path: /health
                  port: 8080
                periodSeconds: 1
                failureThreshold: 60
              env:
                - name: PORT
                  value: "8080"
                - name: EXPECTED_PREFIX
                  value: v2
                - name: SINK_URL
                  value: http://order-flow-nats-sink.fluidbg-demo:8080
    service:
      selector:
        app: order-flow-nats-verifier
      ports:
        - port: 8080
          targetPort: 8080
    dataVerification:
      verifyPath: /result/{testId}
      timeoutSeconds: 120
  promotion:
    data:
      minTestCases: 3
      successRate: 1.0
      timeoutSeconds: 300
    strategy:
      type: progressive
      progressive:
        steps:
          - trafficPercent: 10
            observeCases: 3
            successRate: 1.0
          - trafficPercent: 50
            observeCases: 8
            successRate: 1.0
          - trafficPercent: 100
            observeCases: 12
            successRate: 1.0
