apiVersion: v1
kind: Service
metadata:
  name: fluidbg-nats-manager
  labels:
    {{- include "fluidbg.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats-manager
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fluidbg-nats-manager
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 9090
      targetPort: http
{{- end }}
{{- if and .Values.builtinPlugins.install .Values.builtinPlugins.azureServiceBus.enabled .Values.builtinPlugins.azureServiceBus.manager.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluidbg-azure-servicebus-manager
  labels:
    {{- include "fluidbg.labels" . | nindent 4 }}
    app.kubernetes.io/component: azure-servicebus-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fluidbg-azure-servicebus-manager
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluidbg-azure-servicebus-manager
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: azure-servicebus-manager
        {{- if .Values.builtinPlugins.azureServiceBus.manager.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
        {{- with .Values.builtinPlugins.azureServiceBus.manager.workloadIdentity.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.builtinPlugins.azureServiceBus.manager.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.builtinPlugins.azureServiceBus.manager.workloadIdentity.podAnnotations .Values.builtinPlugins.azureServiceBus.manager.podAnnotations }}
      annotations:
        {{- with .Values.builtinPlugins.azureServiceBus.manager.workloadIdentity.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.builtinPlugins.azureServiceBus.manager.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.builtinPlugins.azureServiceBus.manager.workloadIdentity.serviceAccountName }}
      serviceAccountName: {{ . | quote }}
      {{- end }}
      {{- with .Values.operator.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.operator.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.builtinPlugins.azureServiceBus.image.repository }}:{{ .Values.builtinPlugins.azureServiceBus.image.tag | default .Values.global.imageTag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.operator.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: FLUIDBG_PLUGIN_MANAGER
              value: "true"
            {{- with .Values.builtinPlugins.azureServiceBus.rustLog }}
            - name: RUST_LOG
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.builtinPlugins.azureServiceBus.manager.controlPlaneTls.enabled }}
            - name: FLUIDBG_CONTROL_PLANE_TLS_ENABLED
              value: "true"
            - name: FLUIDBG_CONTROL_PLANE_TLS_CERT_PATH
              value: {{ required "builtinPlugins.azureServiceBus.manager.controlPlaneTls.certPath is required when manager control-plane TLS is enabled" .Values.builtinPlugins.azureServiceBus.manager.controlPlaneTls.certPath | quote }}
            - name: FLUIDBG_CONTROL_PLANE_TLS_KEY_PATH
              value: {{ required "builtinPlugins.azureServiceBus.manager.controlPlaneTls.keyPath is required when manager control-plane TLS is enabled" .Values.builtinPlugins.azureServiceBus.manager.controlPlaneTls.keyPath | quote }}
            {{- end }}
            - name: FLUIDBG_MANAGER_AUTH_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.operator.auth.signingSecretName | quote }}
                  key: {{ .Values.operator.auth.signingSecretKey | quote }}
            {{- if .Values.builtinPlugins.azureServiceBus.manager.connectionStringSecretName }}
            - name: AZURE_SERVICEBUS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.builtinPlugins.azureServiceBus.manager.connectionStringSecretName | quote }}
                  key: {{ .Values.builtinPlugins.azureServiceBus.manager.connectionStringSecretKey | quote }}
            {{- end }}
            {{- with .Values.builtinPlugins.azureServiceBus.manager.fullyQualifiedNamespace }}
            - name: AZURE_SERVICEBUS_NAMESPACE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.builtinPlugins.azureServiceBus.manager.authMode }}
            - name: FLUIDBG_AZURE_SERVICEBUS_AUTH_MODE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.builtinPlugins.azureServiceBus.manager.subscriptionId }}
            - name: FLUIDBG_AZURE_SERVICEBUS_SUBSCRIPTION_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.builtinPlugins.azureServiceBus.manager.resourceGroup }}
            - name: FLUIDBG_AZURE_SERVICEBUS_RESOURCE_GROUP
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.builtinPlugins.azureServiceBus.manager.namespaceName }}
            - name: FLUIDBG_AZURE_SERVICEBUS_NAMESPACE_NAME
              value: {{ . | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
              {{- if .Values.builtinPlugins.azureServiceBus.manager.controlPlaneTls.enabled }}
              scheme: HTTPS
              {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
              {{- if .Values.builtinPlugins.azureServiceBus.manager.controlPlaneTls.enabled }}
              scheme: HTTPS
              {{- end }}
          {{- with .Values.builtinPlugins.azureServiceBus.manager.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.builtinPlugins.azureServiceBus.manager.resources | nindent 12 }}
      {{- with .Values.builtinPlugins.azureServiceBus.manager.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: fluidbg-azure-servicebus-manager
  labels:
    {{- include "fluidbg.labels" . | nindent 4 }}
    app.kubernetes.io/component: azure-servicebus-manager
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fluidbg-azure-servicebus-manager
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 9090
      targetPort: http
{{- end }}
