{{- if and .Values.builtinPlugins.install .Values.builtinPlugins.rabbitmq.enabled .Values.builtinPlugins.rabbitmq.manager.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluidbg-rabbitmq-manager
  labels:
    {{- include "fluidbg.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fluidbg-rabbitmq-manager
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluidbg-rabbitmq-manager
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: rabbitmq-manager
        {{- with .Values.builtinPlugins.rabbitmq.manager.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- toYaml .Values.builtinPlugins.rabbitmq.manager.podAnnotations | nindent 8 }}
    spec:
      {{- with .Values.operator.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.operator.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.builtinPlugins.rabbitmq.image.repository }}:{{ .Values.builtinPlugins.rabbitmq.image.tag | default .Values.global.imageTag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.operator.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: FLUIDBG_PLUGIN_MANAGER
              value: "true"
            {{- with .Values.builtinPlugins.rabbitmq.rustLog }}
            - name: RUST_LOG
              value: {{ . | quote }}
            {{- end }}
            - name: FLUIDBG_MANAGER_AUTH_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.operator.auth.signingSecretName | quote }}
                  key: {{ .Values.operator.auth.signingSecretKey | quote }}
            {{- if or .Values.builtinPlugins.rabbitmq.manager.amqpUrlSecretName .Values.builtinPlugins.rabbitmq.manager.amqpUrl }}
            - name: FLUIDBG_RABBITMQ_MANAGER_AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "fluidbg.rabbitmqManagerSecretName" . | quote }}
                  key: {{ .Values.builtinPlugins.rabbitmq.manager.amqpUrlSecretKey | quote }}
            {{- end }}
            {{- if or .Values.builtinPlugins.rabbitmq.manager.amqpUrlSecretName .Values.builtinPlugins.rabbitmq.manager.managementUrl }}
            - name: FLUIDBG_RABBITMQ_MANAGER_MANAGEMENT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "fluidbg.rabbitmqManagerSecretName" . | quote }}
                  key: {{ .Values.builtinPlugins.rabbitmq.manager.managementUrlSecretKey | quote }}
                  optional: true
            {{- end }}
            {{- if or .Values.builtinPlugins.rabbitmq.manager.amqpUrlSecretName .Values.builtinPlugins.rabbitmq.manager.managementUsername }}
            - name: FLUIDBG_RABBITMQ_MANAGER_MANAGEMENT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "fluidbg.rabbitmqManagerSecretName" . | quote }}
                  key: {{ .Values.builtinPlugins.rabbitmq.manager.managementUsernameSecretKey | quote }}
                  optional: true
            {{- end }}
            {{- if or .Values.builtinPlugins.rabbitmq.manager.amqpUrlSecretName .Values.builtinPlugins.rabbitmq.manager.managementPassword }}
            - name: FLUIDBG_RABBITMQ_MANAGER_MANAGEMENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fluidbg.rabbitmqManagerSecretName" . | quote }}
                  key: {{ .Values.builtinPlugins.rabbitmq.manager.managementPasswordSecretKey | quote }}
                  optional: true
            {{- end }}
            {{- if or .Values.builtinPlugins.rabbitmq.manager.amqpUrlSecretName .Values.builtinPlugins.rabbitmq.manager.amqpUrl .Values.builtinPlugins.rabbitmq.manager.managementUrl .Values.builtinPlugins.rabbitmq.manager.managementUsername .Values.builtinPlugins.rabbitmq.manager.managementPassword }}
            - name: FLUIDBG_RABBITMQ_MANAGER_MANAGEMENT_VHOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "fluidbg.rabbitmqManagerSecretName" . | quote }}
                  key: {{ .Values.builtinPlugins.rabbitmq.manager.managementVhostSecretKey | quote }}
                  optional: true
            {{- end }}
            {{- if .Values.builtinPlugins.rabbitmq.manager.managementAllowInsecure }}
            - name: FLUIDBG_RABBITMQ_MANAGER_MANAGEMENT_ALLOW_INSECURE
              value: "true"
            {{- end }}
            {{- with .Values.builtinPlugins.rabbitmq.manager.amqpCaCertPath }}
            - name: FLUIDBG_RABBITMQ_MANAGER_AMQP_CA_CERT_PATH
              value: {{ . | quote }}
            - name: FLUIDBG_RABBITMQ_AMQP_CA_CERT_PATH
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.builtinPlugins.rabbitmq.manager.managementCaCertPath }}
            - name: FLUIDBG_RABBITMQ_MANAGER_MANAGEMENT_CA_CERT_PATH
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.builtinPlugins.rabbitmq.manager.managementInsecureSkipVerify }}
            - name: FLUIDBG_RABBITMQ_MANAGER_MANAGEMENT_INSECURE_SKIP_VERIFY
              value: "true"
            {{- end }}
            {{- if .Values.builtinPlugins.rabbitmq.manager.controlPlaneTls.enabled }}
            - name: FLUIDBG_CONTROL_PLANE_TLS_ENABLED
              value: "true"
            - name: FLUIDBG_CONTROL_PLANE_TLS_CERT_PATH
              value: {{ required "builtinPlugins.rabbitmq.manager.controlPlaneTls.certPath is required when manager control-plane TLS is enabled" .Values.builtinPlugins.rabbitmq.manager.controlPlaneTls.certPath | quote }}
            - name: FLUIDBG_CONTROL_PLANE_TLS_KEY_PATH
              value: {{ required "builtinPlugins.rabbitmq.manager.controlPlaneTls.keyPath is required when manager control-plane TLS is enabled" .Values.builtinPlugins.rabbitmq.manager.controlPlaneTls.keyPath | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
              {{- if .Values.builtinPlugins.rabbitmq.manager.controlPlaneTls.enabled }}
              scheme: HTTPS
              {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
              {{- if .Values.builtinPlugins.rabbitmq.manager.controlPlaneTls.enabled }}
              scheme: HTTPS
              {{- end }}
          {{- with .Values.builtinPlugins.rabbitmq.manager.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.builtinPlugins.rabbitmq.manager.resources | nindent 12 }}
      {{- with .Values.builtinPlugins.rabbitmq.manager.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: fluidbg-rabbitmq-manager
  labels:
    {{- include "fluidbg.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq-manager
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fluidbg-rabbitmq-manager
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 9090
      targetPort: http
{{- end }}
{{- if and .Values.builtinPlugins.install .Values.builtinPlugins.nats.enabled .Values.builtinPlugins.nats.manager.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluidbg-nats-manager
  labels:
    {{- include "fluidbg.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fluidbg-nats-manager
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluidbg-nats-manager
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: nats-manager
        {{- with .Values.builtinPlugins.nats.manager.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- toYaml .Values.builtinPlugins.nats.manager.podAnnotations | nindent 8 }}
    spec:
      {{- with .Values.operator.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.operator.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.builtinPlugins.nats.image.repository }}:{{ .Values.builtinPlugins.nats.image.tag | default .Values.global.imageTag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.operator.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: FLUIDBG_PLUGIN_MANAGER
              value: "true"
            {{- with .Values.builtinPlugins.nats.rustLog }}
            - name: RUST_LOG
              value: {{ . | quote }}
            {{- end }}
            - name: FLUIDBG_MANAGER_AUTH_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.operator.auth.signingSecretName | quote }}
                  key: {{ .Values.operator.auth.signingSecretKey | quote }}
            - name: FLUIDBG_NATS_MANAGER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "fluidbg.natsManagerSecretName" . | quote }}
                  key: {{ .Values.builtinPlugins.nats.manager.urlSecretKey | quote }}
            {{- if .Values.builtinPlugins.nats.manager.requireTls }}
            - name: FLUIDBG_NATS_REQUIRE_TLS
              value: "true"
            {{- end }}
            {{- with .Values.builtinPlugins.nats.manager.caCertPath }}
            - name: FLUIDBG_NATS_CA_CERT_PATH
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.builtinPlugins.nats.manager.inceptorUrl }}
            - name: FLUIDBG_NATS_INCEPTOR_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "fluidbg.natsManagerSecretName" . | quote }}
                  key: {{ .Values.builtinPlugins.nats.manager.inceptorUrlSecretKey | quote }}
            {{- end }}
            {{- if .Values.builtinPlugins.nats.manager.controlPlaneTls.enabled }}
            - name: FLUIDBG_CONTROL_PLANE_TLS_ENABLED
              value: "true"
            - name: FLUIDBG_CONTROL_PLANE_TLS_CERT_PATH
              value: {{ required "builtinPlugins.nats.manager.controlPlaneTls.certPath is required when manager control-plane TLS is enabled" .Values.builtinPlugins.nats.manager.controlPlaneTls.certPath | quote }}
            - name: FLUIDBG_CONTROL_PLANE_TLS_KEY_PATH
              value: {{ required "builtinPlugins.nats.manager.controlPlaneTls.keyPath is required when manager control-plane TLS is enabled" .Values.builtinPlugins.nats.manager.controlPlaneTls.keyPath | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
              {{- if .Values.builtinPlugins.nats.manager.controlPlaneTls.enabled }}
              scheme: HTTPS
              {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
              {{- if .Values.builtinPlugins.nats.manager.controlPlaneTls.enabled }}
              scheme: HTTPS
              {{- end }}
          {{- with .Values.builtinPlugins.nats.manager.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.builtinPlugins.nats.manager.resources | nindent 12 }}
      {{- with .Values.builtinPlugins.nats.manager.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
