      {{- end }}
      {{- if $root.Values.operator.api.tls.enabled }}
      {{- with $root.Values.operator.api.tls.caCertPath }}
      - name: FLUIDBG_OPERATOR_CA_CERT_PATH
        value: {{ . | quote }}
      {{- end }}
      {{- if $root.Values.operator.api.tls.insecureSkipVerify }}
      - name: FLUIDBG_OPERATOR_INSECURE_SKIP_VERIFY
        value: "true"
      {{- end }}
      {{- end }}
    {{- end }}
    {{- if $root.Values.builtinPlugins.azureServiceBus.controlPlaneTls.enabled }}
    controlPlaneTls:
      enabled: true
      port: {{ $root.Values.builtinPlugins.azureServiceBus.controlPlaneTls.port | default 9090 }}
      {{- with $root.Values.builtinPlugins.azureServiceBus.controlPlaneTls.caCertPath }}
      caCertPath: {{ . | quote }}
      {{- end }}
      insecureSkipVerify: {{ $root.Values.builtinPlugins.azureServiceBus.controlPlaneTls.insecureSkipVerify | default false }}
    {{- end }}
    {{- with $root.Values.builtinPlugins.azureServiceBus.inceptorVolumes }}
    volumes:
{{ toYaml . | nindent 6 }}
    {{- end }}
    {{- if $root.Values.builtinPlugins.azureServiceBus.inceptorWorkloadIdentity.enabled }}
    podLabels:
      azure.workload.identity/use: "true"
      {{- with $root.Values.builtinPlugins.azureServiceBus.inceptorWorkloadIdentity.podLabels }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- with $root.Values.builtinPlugins.azureServiceBus.inceptorWorkloadIdentity.podAnnotations }}
    podAnnotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $root.Values.builtinPlugins.azureServiceBus.inceptorWorkloadIdentity.serviceAccountName }}
    serviceAccountName: {{ . | quote }}
    {{- end }}
    {{- end }}
    ports:
      - name: health
        containerPort: 9090
    {{- with $root.Values.builtinPlugins.azureServiceBus.inceptorVolumeMounts }}
    volumeMounts:
      - name: plugin-config
        mountPath: /etc/fluidbg
        readOnly: true
{{ toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
{{- end -}}

{{- if .Values.builtinPlugins.install }}
{{- $hookName := printf "%s-builtin-plugin-hook" (include "fluidbg.fullname" .) | trunc 63 | trimSuffix "-" -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $hookName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fluidbg.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade,pre-delete
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $hookName }}
  labels:
    {{- include "fluidbg.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade,pre-delete
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["fluidbg.io"]
    resources: ["inceptionplugins"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $hookName }}
  labels:
    {{- include "fluidbg.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade,pre-delete
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $hookName }}
subjects:
  - kind: ServiceAccount
    name: {{ $hookName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $hookName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fluidbg.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade,pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  plugins.yaml: |
    {{- include "fluidbg.builtinPluginManifests" . | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-apply" $hookName | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fluidbg.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "fluidbg.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: builtin-plugin-hook
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $hookName }}
      containers:
        - name: builtin-plugin-hook
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag | default .Values.global.imageTag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          args:
            - builtin-plugins
            - apply
            - /manifests/plugins.yaml
          volumeMounts:
            - name: builtin-plugin-manifests
              mountPath: /manifests
              readOnly: true
          securityContext:
            {{- toYaml .Values.operator.securityContext | nindent 12 }}
      volumes:
        - name: builtin-plugin-manifests
          configMap:
            name: {{ $hookName }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-delete" $hookName | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fluidbg.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "fluidbg.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: builtin-plugin-hook
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $hookName }}
      containers:
        - name: builtin-plugin-hook
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag | default .Values.global.imageTag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          args:
            - builtin-plugins
            - delete
            - /manifests/plugins.yaml
          volumeMounts:
            - name: builtin-plugin-manifests
              mountPath: /manifests
              readOnly: true
          securityContext:
            {{- toYaml .Values.operator.securityContext | nindent 12 }}
      volumes:
        - name: builtin-plugin-manifests
          configMap:
            name: {{ $hookName }}
{{- end }}
