{{- define "fluidbg.builtinPluginManifests" -}}
{{- $root := . -}}
{{- if $root.Values.builtinPlugins.rabbitmq.enabled }}
---
apiVersion: fluidbg.io/v1alpha1
kind: InceptionPlugin
metadata:
  name: rabbitmq
  labels:
    {{- include "fluidbg.labels" $root | nindent 4 }}
spec:
  description: "RabbitMQ transport plugin"
  image: "{{ $root.Values.builtinPlugins.rabbitmq.image.repository }}:{{ $root.Values.builtinPlugins.rabbitmq.image.tag | default $root.Values.global.imageTag | default $root.Chart.AppVersion }}"
  supportedRoles: [duplicator, splitter, observer, writer, consumer, combiner]
  roleConstraints:
    mutuallyExclusive:
      - roles: [duplicator, splitter, combiner, consumer]
        reason: "Only one transport movement role can own the RabbitMQ polling loop for an inceptor. Observer and writer are additive."
  topology: standalone
  lifecycle:
    preparePath: /prepare
    activatePath: /activate
    drainPath: /drain
    drainStatusPath: /drain-status
    cleanupPath: /cleanup
    trafficShiftPath: /traffic
  features:
    supportsProgressiveShifting: true
  {{- if $root.Values.builtinPlugins.rabbitmq.manager.enabled }}
  manager:
    serviceName: fluidbg-rabbitmq-manager
    namespace: {{ $root.Release.Namespace }}
    port: 9090
    preparePath: /manager/prepare
    cleanupPath: /manager/cleanup
    syncPath: /manager/sync
    {{- if $root.Values.builtinPlugins.rabbitmq.manager.controlPlaneTls.enabled }}
    controlPlaneTls:
      enabled: true
      port: {{ $root.Values.builtinPlugins.rabbitmq.manager.controlPlaneTls.port | default 9090 }}
      {{- with $root.Values.builtinPlugins.rabbitmq.manager.controlPlaneTls.caCertPath }}
      caCertPath: {{ . | quote }}
      {{- end }}
      insecureSkipVerify: {{ $root.Values.builtinPlugins.rabbitmq.manager.controlPlaneTls.insecureSkipVerify | default false }}
    {{- end }}
  {{- end }}
  fieldNamespaces: [queue]
  configSchema:
    type: object
    additionalProperties: false
    properties:
      queueDeclaration:
        type: object
        properties:
          durable: { type: boolean }
          exclusive: { type: boolean }
          autoDelete: { type: boolean }
          arguments: { type: object }
      shadowQueue:
        type: object
        properties:
          suffix: { type: string }
          queueDeclaration:
            type: object
            properties:
              durable: { type: boolean }
              exclusive: { type: boolean }
              autoDelete: { type: boolean }
              arguments: { type: object }
      duplicator:
        type: object
        properties:
          inputQueue: { type: string }
          greenInputQueue: { type: string }
          blueInputQueue: { type: string }
          greenInputQueueEnvVar: { type: string }
          blueInputQueueEnvVar: { type: string }
          temporaryQueueIdentifier: { type: string, minLength: 1, maxLength: 40, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$" }
      splitter:
        type: object
        properties:
          inputQueue: { type: string }
          greenInputQueue: { type: string }
          blueInputQueue: { type: string }
          greenInputQueueEnvVar: { type: string }
          blueInputQueueEnvVar: { type: string }
          temporaryQueueIdentifier: { type: string, minLength: 1, maxLength: 40, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$" }
      combiner:
        type: object
        properties:
          outputQueue: { type: string }
          greenOutputQueue: { type: string }
          blueOutputQueue: { type: string }
          greenOutputQueueEnvVar: { type: string }
          blueOutputQueueEnvVar: { type: string }
          temporaryQueueIdentifier: { type: string, minLength: 1, maxLength: 40, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$" }
      writer:
        type: object
        properties:
          targetQueue: { type: string }
      consumer:
        type: object
        properties:
          inputQueue: { type: string }
      observer:
        type: object
        properties:
          testId: { type: object }
          match: { type: array }
          notifyPath: { type: string }
  inceptor:
    {{- if or $root.Values.builtinPlugins.rabbitmq.rustLog $root.Values.builtinPlugins.rabbitmq.controlPlaneTls.enabled $root.Values.operator.api.tls.enabled }}
    env:
      {{- with $root.Values.builtinPlugins.rabbitmq.rustLog }}
      - name: RUST_LOG
        value: {{ . | quote }}
      {{- end }}
      {{- if $root.Values.builtinPlugins.rabbitmq.controlPlaneTls.enabled }}
      - name: FLUIDBG_CONTROL_PLANE_TLS_ENABLED
        value: "true"
      - name: FLUIDBG_CONTROL_PLANE_TLS_CERT_PATH
        value: {{ required "builtinPlugins.rabbitmq.controlPlaneTls.certPath is required when inceptor control-plane TLS is enabled" $root.Values.builtinPlugins.rabbitmq.controlPlaneTls.certPath | quote }}
      - name: FLUIDBG_CONTROL_PLANE_TLS_KEY_PATH
        value: {{ required "builtinPlugins.rabbitmq.controlPlaneTls.keyPath is required when inceptor control-plane TLS is enabled" $root.Values.builtinPlugins.rabbitmq.controlPlaneTls.keyPath | quote }}
      {{- end }}
      {{- if $root.Values.operator.api.tls.enabled }}
      {{- with $root.Values.operator.api.tls.caCertPath }}
      - name: FLUIDBG_OPERATOR_CA_CERT_PATH
        value: {{ . | quote }}
      {{- end }}
      {{- if $root.Values.operator.api.tls.insecureSkipVerify }}
      - name: FLUIDBG_OPERATOR_INSECURE_SKIP_VERIFY
        value: "true"
      {{- end }}
      {{- end }}
    {{- end }}
    {{- if $root.Values.builtinPlugins.rabbitmq.controlPlaneTls.enabled }}
    controlPlaneTls:
      enabled: true
      port: {{ $root.Values.builtinPlugins.rabbitmq.controlPlaneTls.port | default 9090 }}
      {{- with $root.Values.builtinPlugins.rabbitmq.controlPlaneTls.caCertPath }}
      caCertPath: {{ . | quote }}
      {{- end }}
      insecureSkipVerify: {{ $root.Values.builtinPlugins.rabbitmq.controlPlaneTls.insecureSkipVerify | default false }}
    {{- end }}
    {{- with $root.Values.builtinPlugins.rabbitmq.inceptorVolumes }}
    volumes:
{{ toYaml . | nindent 6 }}
    {{- end }}
    ports:
      - name: health
        containerPort: 9090
    {{- with $root.Values.builtinPlugins.rabbitmq.inceptorVolumeMounts }}
    volumeMounts:
      - name: plugin-config
        mountPath: /etc/fluidbg
        readOnly: true
{{ toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
{{- if $root.Values.builtinPlugins.http.enabled }}
---
apiVersion: fluidbg.io/v1alpha1
kind: InceptionPlugin
metadata:
  name: http
  labels:
    {{- include "fluidbg.labels" $root | nindent 4 }}
spec:
  description: "HTTP transport plugin for observing, mocking, and writing HTTP traffic"
  image: "{{ $root.Values.builtinPlugins.http.image.repository }}:{{ $root.Values.builtinPlugins.http.image.tag | default $root.Values.global.imageTag | default $root.Chart.AppVersion }}"
  supportedRoles: [splitter, observer, mock, writer]
  topology: standalone
  lifecycle:
    preparePath: /prepare
    activatePath: /activate
    drainPath: /drain
    drainStatusPath: /drain-status
    cleanupPath: /cleanup
    trafficShiftPath: /traffic
  features:
    supportsProgressiveShifting: true
  fieldNamespaces: [http]
  configSchema:
    type: object
    additionalProperties: false
    properties:
      port: { type: integer }
      proxyProtocol: { type: string, enum: [http, https] }
      writeProtocol: { type: string, enum: [http, https] }
      realEndpoint: { type: string }
      targetUrl: { type: string }
      greenEndpoint: { type: string }
      blueEndpoint: { type: string }
      envVarName: { type: string }
      writeEnvVar: { type: string }
      verifierEndpoint: { type: string }
      mockPath: { type: string }
      testId: { type: object }
      match: { type: array }
      filters: { type: array }
      ingress: { type: object }
      egress: { type: object }
      tls:
        type: object
        properties:
          inbound:
            type: object
            properties:
              enabled: { type: boolean }
              port: { type: integer }
              certPath: { type: string }
              keyPath: { type: string }
      clientTls:
        type: object
        properties:
          caCertPath: { type: string }
          insecureSkipVerify: { type: boolean }
  inceptor:
    {{- if or $root.Values.builtinPlugins.http.rustLog $root.Values.operator.api.tls.enabled $root.Values.builtinPlugins.http.controlPlaneTls.enabled }}
    env:
      {{- with $root.Values.builtinPlugins.http.rustLog }}
      - name: RUST_LOG
        value: {{ . | quote }}
      {{- end }}
      {{- if $root.Values.builtinPlugins.http.controlPlaneTls.enabled }}
      - name: FLUIDBG_CONTROL_PLANE_TLS_ENABLED
        value: "true"
      - name: FLUIDBG_CONTROL_PLANE_TLS_CERT_PATH
        value: {{ required "builtinPlugins.http.controlPlaneTls.certPath is required when HTTP control-plane TLS is enabled" $root.Values.builtinPlugins.http.controlPlaneTls.certPath | quote }}
      - name: FLUIDBG_CONTROL_PLANE_TLS_KEY_PATH
        value: {{ required "builtinPlugins.http.controlPlaneTls.keyPath is required when HTTP control-plane TLS is enabled" $root.Values.builtinPlugins.http.controlPlaneTls.keyPath | quote }}
      - name: FLUIDBG_CONTROL_PLANE_TLS_PORT
        value: {{ $root.Values.builtinPlugins.http.controlPlaneTls.port | default 9443 | quote }}
      {{- end }}
      {{- if $root.Values.operator.api.tls.enabled }}
      {{- with $root.Values.operator.api.tls.caCertPath }}
      - name: FLUIDBG_OPERATOR_CA_CERT_PATH
        value: {{ . | quote }}
      {{- end }}
      {{- if $root.Values.operator.api.tls.insecureSkipVerify }}
      - name: FLUIDBG_OPERATOR_INSECURE_SKIP_VERIFY
        value: "true"
      {{- end }}
      {{- end }}
    {{- end }}
    {{- if $root.Values.builtinPlugins.http.controlPlaneTls.enabled }}
    controlPlaneTls:
      enabled: true
      port: {{ $root.Values.builtinPlugins.http.controlPlaneTls.port | default 9443 }}
      {{- with $root.Values.builtinPlugins.http.controlPlaneTls.caCertPath }}
      caCertPath: {{ . | quote }}
      {{- end }}
      insecureSkipVerify: {{ $root.Values.builtinPlugins.http.controlPlaneTls.insecureSkipVerify | default false }}
    {{- end }}
    {{- with $root.Values.builtinPlugins.http.inceptorVolumes }}
    volumes:
{{ toYaml . | nindent 6 }}
    {{- end }}
    ports:
      - name: http
        containerPort: 9090
      - name: https
        containerPort: 9443
    volumeMounts:
      - name: plugin-config
        mountPath: /etc/fluidbg
        readOnly: true
      {{- with $root.Values.builtinPlugins.http.inceptorVolumeMounts }}
{{ toYaml . | nindent 6 }}
      {{- end }}
  injects:
    blueContainer:
      env:
        - nameFromConfig: envVarName
          valueTemplate: "{{`{{proxyUrl}}`}}"
          restoreValueTemplate: "{{`{{realEndpoint}}`}}"
    testContainer:
      env:
        - nameFromConfig: writeEnvVar
          valueTemplate: "{{`{{writeUrl}}`}}"
{{- end }}
{{- if $root.Values.builtinPlugins.nats.enabled }}
---
apiVersion: fluidbg.io/v1alpha1
kind: InceptionPlugin
metadata:
  name: nats
  labels:
    {{- include "fluidbg.labels" $root | nindent 4 }}
spec:
  description: "NATS JetStream transport plugin"
  image: "{{ $root.Values.builtinPlugins.nats.image.repository }}:{{ $root.Values.builtinPlugins.nats.image.tag | default $root.Values.global.imageTag | default $root.Chart.AppVersion }}"
  supportedRoles: [duplicator, splitter, observer, writer, consumer, combiner]
  roleConstraints:
    mutuallyExclusive:
      - roles: [duplicator, splitter, combiner, consumer]
        reason: "Only one transport movement role can own the NATS JetStream polling loop for an inceptor. Observer and writer are additive."
  topology: standalone
  lifecycle:
    preparePath: /prepare
    activatePath: /activate
    drainPath: /drain
    drainStatusPath: /drain-status
    cleanupPath: /cleanup
    trafficShiftPath: /traffic
  features:
    supportsProgressiveShifting: true
  {{- if $root.Values.builtinPlugins.nats.manager.enabled }}
  manager:
    serviceName: fluidbg-nats-manager
    namespace: {{ $root.Release.Namespace }}
    port: 9090
    preparePath: /manager/prepare
    cleanupPath: /manager/cleanup
    syncPath: /manager/sync
    {{- if $root.Values.builtinPlugins.nats.manager.controlPlaneTls.enabled }}
    controlPlaneTls:
      enabled: true
      port: {{ $root.Values.builtinPlugins.nats.manager.controlPlaneTls.port | default 9090 }}
      {{- with $root.Values.builtinPlugins.nats.manager.controlPlaneTls.caCertPath }}
      caCertPath: {{ . | quote }}
      {{- end }}
      insecureSkipVerify: {{ $root.Values.builtinPlugins.nats.manager.controlPlaneTls.insecureSkipVerify | default false }}
    {{- end }}
  {{- end }}
  fieldNamespaces: [nats]
  configSchema:
    type: object
    additionalProperties: false
    properties:
      stream:
        type: object
        properties:
          subjects: { type: array, items: { type: string } }
          storage: { type: string, enum: [file, memory] }
          retention: { type: string, enum: [limits, interest, workqueue, workQueue] }
          replicas: { type: integer, minimum: 1, maximum: 5 }
          maxMessages: { type: integer }
          maxBytes: { type: integer }
          maxAgeSeconds: { type: integer }
          discard: { type: string, enum: [old, new] }
          allowRollup: { type: boolean }
          denyDelete: { type: boolean }
          denyPurge: { type: boolean }
          placement:
            type: object
            properties:
              cluster: { type: string }
              tags: { type: array, items: { type: string } }
          persistenceMode: { type: string, enum: [default, async] }
          subjectTransform:
            type: object
            properties:
              source: { type: string }
              destination: { type: string }
          metadata:
            type: object
            additionalProperties: { type: string }
      duplicator:
        type: object
        properties:
          inputSubject: { type: string }
          queueGroup: { type: string }
          greenInputSubject: { type: string }
          blueInputSubject: { type: string }
          greenInputSubjectEnvVar: { type: string }
          blueInputSubjectEnvVar: { type: string }
          greenQueueGroup: { type: string }
          blueQueueGroup: { type: string }
          greenQueueGroupEnvVar: { type: string }
          blueQueueGroupEnvVar: { type: string }
          temporarySubjectIdentifier: { type: string, minLength: 1, maxLength: 40, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$" }
      splitter:
        type: object
        properties:
          inputSubject: { type: string }
          queueGroup: { type: string }
          greenInputSubject: { type: string }
          blueInputSubject: { type: string }
          greenInputSubjectEnvVar: { type: string }
          blueInputSubjectEnvVar: { type: string }
          greenQueueGroup: { type: string }
          blueQueueGroup: { type: string }
          greenQueueGroupEnvVar: { type: string }
          blueQueueGroupEnvVar: { type: string }
          temporarySubjectIdentifier: { type: string, minLength: 1, maxLength: 40, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$" }
      combiner:
        type: object
        properties:
          outputSubject: { type: string }
          greenOutputSubject: { type: string }
          blueOutputSubject: { type: string }
          greenOutputSubjectEnvVar: { type: string }
          blueOutputSubjectEnvVar: { type: string }
          temporarySubjectIdentifier: { type: string, minLength: 1, maxLength: 40, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$" }
      writer:
        type: object
        properties:
          targetSubject: { type: string }
      consumer:
        type: object
        properties:
          inputSubject: { type: string }
      observer:
        type: object
        properties:
          testId: { type: object }
          match: { type: array }
          notifyPath: { type: string }
  inceptor:
    {{- if or $root.Values.builtinPlugins.nats.rustLog $root.Values.builtinPlugins.nats.controlPlaneTls.enabled $root.Values.operator.api.tls.enabled }}
    env:
      {{- with $root.Values.builtinPlugins.nats.rustLog }}
      - name: RUST_LOG
        value: {{ . | quote }}
      {{- end }}
      {{- if $root.Values.builtinPlugins.nats.controlPlaneTls.enabled }}
      - name: FLUIDBG_CONTROL_PLANE_TLS_ENABLED
        value: "true"
      - name: FLUIDBG_CONTROL_PLANE_TLS_CERT_PATH
        value: {{ required "builtinPlugins.nats.controlPlaneTls.certPath is required when NATS control-plane TLS is enabled" $root.Values.builtinPlugins.nats.controlPlaneTls.certPath | quote }}
      - name: FLUIDBG_CONTROL_PLANE_TLS_KEY_PATH
        value: {{ required "builtinPlugins.nats.controlPlaneTls.keyPath is required when NATS control-plane TLS is enabled" $root.Values.builtinPlugins.nats.controlPlaneTls.keyPath | quote }}
      {{- end }}
      {{- if $root.Values.builtinPlugins.nats.manager.requireTls }}
      - name: FLUIDBG_NATS_REQUIRE_TLS
        value: "true"
      {{- end }}
      {{- with $root.Values.builtinPlugins.nats.manager.caCertPath }}
      - name: FLUIDBG_NATS_CA_CERT_PATH
        value: {{ . | quote }}
      {{- end }}
      {{- if $root.Values.operator.api.tls.enabled }}
      {{- with $root.Values.operator.api.tls.caCertPath }}
      - name: FLUIDBG_OPERATOR_CA_CERT_PATH
        value: {{ . | quote }}
      {{- end }}
      {{- if $root.Values.operator.api.tls.insecureSkipVerify }}
      - name: FLUIDBG_OPERATOR_INSECURE_SKIP_VERIFY
        value: "true"
      {{- end }}
      {{- end }}
    {{- end }}
    {{- if $root.Values.builtinPlugins.nats.controlPlaneTls.enabled }}
    controlPlaneTls:
      enabled: true
      port: {{ $root.Values.builtinPlugins.nats.controlPlaneTls.port | default 9090 }}
      {{- with $root.Values.builtinPlugins.nats.controlPlaneTls.caCertPath }}
      caCertPath: {{ . | quote }}
      {{- end }}
      insecureSkipVerify: {{ $root.Values.builtinPlugins.nats.controlPlaneTls.insecureSkipVerify | default false }}
    {{- end }}
    {{- with $root.Values.builtinPlugins.nats.inceptorVolumes }}
    volumes:
{{ toYaml . | nindent 6 }}
    {{- end }}
    ports:
      - name: health
        containerPort: 9090
    {{- with $root.Values.builtinPlugins.nats.inceptorVolumeMounts }}
    volumeMounts:
      - name: plugin-config
        mountPath: /etc/fluidbg
        readOnly: true
{{ toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
