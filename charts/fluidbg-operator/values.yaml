nameOverride: ""
fullnameOverride: ""

global:
  # Shared image tag for the operator and all built-in plugin images. Empty
  # defaults to Chart.appVersion. Component-specific image.tag values override
  # this value.
  imageTag: ""

operator:
  replicaCount: 1
  image:
    repository: ghcr.io/dlahmad/fbg-operator
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  podAnnotations: {}
  podLabels: {}
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  # Optional RUST_LOG override. Empty uses the operator binary default:
  # warn,fluidbg_operator=info. Examples: debug, fluidbg_operator=debug,warn.
  rustLog: ""
  auth:
    createSigningSecret: false
    signingSecretNamespace: ""
    signingSecretName: fluidbg-operator-auth
    signingSecretKey: signing-key
    signingSecretValue: ""
  api:
    port: 8090
    tls:
      enabled: false
      certPath: ""
      keyPath: ""
      # Inceptor-local CA bundle path. Mount it with each plugin's
      # inceptorVolumes/inceptorVolumeMounts.
      caCertPath: ""
      insecureSkipVerify: false
  orphanCleanup:
    intervalSeconds: 60
  reconcileLease:
    durationSeconds: 30
    renewIntervalSeconds: 10
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    capabilities:
      drop: ["ALL"]
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

service:
  type: ClusterIP
  port: 8090

rbac:
  create: true

admissionPolicy:
  # Kubernetes ValidatingAdmissionPolicy is used to enforce privilege parity:
  # a user may create/update BlueGreenDeployment only if the same principal has
  # the namespace permissions needed for the generated Deployments, Services,
  # ConfigMaps, Secrets, and FluidBG-labeled Pod cleanup.
  enabled: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

stateStore:
  # The operator process uses one global backend for all watched BGDs.
  type: memory
  postgres:
    authMode: password
    url: ""
    urlSecretName: ""
    urlSecretKey: url
    host: ""
    database: ""
    user: ""
    tableName: fluidbg_cases
    workloadIdentity:
      tenantId: ""
      clientId: ""
      federatedTokenFile: ""
      authorityHost: ""
  cosmos:
    authMode: connectionString
    endpoint: ""
    database: ""
    container: ""
    connectionString: ""
    connectionStringSecretName: ""
    connectionStringSecretKey: connection-string
    accountKey: ""
    accountKeySecretName: ""
    accountKeySecretKey: account-key
    workloadIdentity:
      tenantId: ""
      clientId: ""
      federatedTokenFile: ""
      authorityHost: ""

builtinPlugins:
  install: true
  # Built-in InceptionPlugin registrations are cluster-scoped. Install once and
  # reference them by name from BlueGreenDeployment resources in any namespace.
  http:
    enabled: true
    # Optional RUST_LOG for generated HTTP inceptor pods. Empty uses the binary
    # default: warn,fluidbg_http=info.
    rustLog: ""
    # Optional volumes and mounts added to every generated HTTP inceptor pod.
    # Use these to mount TLS cert/key Secrets and private CA ConfigMaps/Secrets.
    inceptorVolumes: []
    inceptorVolumeMounts: []
    controlPlaneTls:
      enabled: false
      certPath: ""
      keyPath: ""
      # Operator-local CA bundle path. Mount it with operator.extraVolumes.
      caCertPath: ""
      insecureSkipVerify: false
      # Separate HTTPS listener used by the operator for lifecycle calls.
      port: 9443
    image:
      repository: ghcr.io/dlahmad/fbg-plugin-http
      tag: ""
  rabbitmq:
    enabled: true
    # Optional RUST_LOG for RabbitMQ manager and generated inceptor pods. Empty
    # uses the binary default: warn,fluidbg_rabbitmq=info.
    rustLog: ""
    # Optional volumes and mounts added to every generated RabbitMQ inceptor
    # pod. Use these to mount private AMQP/management CA bundles.
    inceptorVolumes: []
    inceptorVolumeMounts: []
    controlPlaneTls:
      enabled: false
      # Operator-local CA bundle path. Mount it with operator.extraVolumes.
      caCertPath: ""
      insecureSkipVerify: false
      certPath: ""
      keyPath: ""
      port: 9090
    image:
      repository: ghcr.io/dlahmad/fbg-plugin-rabbitmq
      tag: ""
    manager:
      enabled: false
      amqpUrl: ""
      amqpUrlSecretName: ""
      amqpUrlSecretKey: amqp-url
      managementUrl: ""
      managementUrlSecretKey: management-url
      managementUsername: ""
      managementUsernameSecretKey: management-username
      managementPassword: ""
      managementPasswordSecretKey: management-password
      managementVhost: "/"
      managementVhostSecretKey: management-vhost
      # Production deployments should use HTTPS for RabbitMQ management API.
      # Set true only for trusted in-cluster/dev RabbitMQ endpoints that expose
      # management over plain HTTP.
      managementAllowInsecure: false
      # Optional CA bundle paths for amqps:// and HTTPS management endpoints.
      # Mount the files with manager.volumes/volumeMounts.
      amqpCaCertPath: ""
      managementCaCertPath: ""
      # Unsafe HTTPS-only dev escape hatch for self-signed management endpoints.
      managementInsecureSkipVerify: false
      volumes: []
      volumeMounts: []
      podAnnotations: {}
      podLabels: {}
      resources: {}
      controlPlaneTls:
        enabled: false
        # Operator-local CA bundle path. Mount it with operator.extraVolumes.
        caCertPath: ""
        insecureSkipVerify: false
        certPath: ""
        keyPath: ""
        port: 9090
  azureServiceBus:
    enabled: true
    # Optional RUST_LOG for Azure Service Bus manager and generated inceptor
    # pods. Empty uses the binary default: warn,fluidbg_azure_servicebus=info.
    rustLog: ""
    inceptorWorkloadIdentity:
      enabled: false
      serviceAccountName: ""
      podAnnotations: {}
      podLabels: {}
    inceptorVolumes: []
    inceptorVolumeMounts: []
    controlPlaneTls:
      enabled: false
      caCertPath: ""
      insecureSkipVerify: false
      certPath: ""
      keyPath: ""
      port: 9090
    manager:
      enabled: false
      connectionStringSecretName: ""
      connectionStringSecretKey: connection-string
      fullyQualifiedNamespace: ""
      authMode: ""
      subscriptionId: ""
      resourceGroup: ""
      namespaceName: ""
      controlPlaneTls:
        enabled: false
        caCertPath: ""
        insecureSkipVerify: false
        certPath: ""
        keyPath: ""
        port: 9090
      workloadIdentity:
        enabled: false
        serviceAccountName: ""
        podAnnotations: {}
        podLabels: {}
      volumes: []
      volumeMounts: []
      podAnnotations: {}
      podLabels: {}
      resources: {}
    image:
      repository: ghcr.io/dlahmad/fbg-plugin-azure-servicebus
      tag: ""
